name: Generate Snake

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kevinz-08
          outputs: |
            dist/snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#DDD6FE,#C4B5FD,#A855F7,#6D28D9
            dist/snake-dark.svg?palette=github-dark&color_snake=#C4B5FD&color_dots=#161b22,#2E1065,#5B21B6,#7C3AED,#A855F7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
